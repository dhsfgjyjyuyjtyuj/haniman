name: Music Reel Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: File wapas save karne ke liye

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install
      run: pip install instagrapi moviepy imageio-ffmpeg Pillow==9.5.0

    - name: Run Bot
      env:
        INSTA_SESSION_ID: ${{ secrets.INSTA_SESSION_ID }}
      run: python bot.py

    - name: Save State
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add state.json
        git commit -m "Update state [skip ci]" || exit 0
        git push